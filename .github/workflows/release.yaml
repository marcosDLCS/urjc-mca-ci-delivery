name: 'Release'

on:
  release:
    branches:
      - master
    types: [ published ]

jobs:
  release_version:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build, run all tests and package artifact with Maven
        run: |
          PROJECT_VERSION=$(mvn -B org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.version -q -DforceStdout)
          mvn -B versions:set -DnewVersion=$PROJECT_VERSION-RELEASE
          mvn -B clean verify -f pom.xml

      - name: Save Jacoco Exec
        uses: actions/upload-artifact@v4
        with:
          name: jacoco_coverage.exec
          path: target/jacoco.exec

      - name: Save Jacoco XML Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco_coverage_report.xml
          path: target/site/jacoco/jacoco.xml
